<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checkout — WinOnAny</title>
<meta name="theme-color" content="#050507">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --void:#050507;--panel:#0B0B0F;--panel-2:#101016;
  --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.12);
  --text:#F2F2F4;--muted:#85858F;--muted-2:#5C5C66;
  --accent:#6E56F8;--accent-lift:#8B78FF;
  --accent-soft:rgba(110,86,248,.14);--accent-line:rgba(110,86,248,.42);
  --display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --gutter:18px;--ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box;border-radius:0}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--void);color:var(--text);
  font-family:var(--display);font-weight:400;font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent-lift);outline-offset:3px}

/* ── rails ── */
.rails{position:fixed;inset:0;z-index:0;pointer-events:none}
.rails-inner{height:100%;max-width:1200px;margin:0 auto;padding:0 18px;display:grid;grid-template-columns:repeat(2,1fr)}
.rails-inner span{border-left:1px solid rgba(255,255,255,.03)}
.rails-inner span:first-child{border-left:0}
@media(min-width:760px){.rails-inner{grid-template-columns:repeat(4,1fr)}}

/* ── background glow ── */
.bg-glow{position:fixed;left:50%;top:-30%;width:min(900px,130vw);aspect-ratio:1/.65;transform:translateX(-50%);pointer-events:none;z-index:0;background:radial-gradient(ellipse at center,rgba(110,86,248,.18),rgba(110,86,248,.05) 44%,transparent 70%);filter:blur(10px);}
.bg-mesh{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse 78% 54% at 50% 22%,#000 20%,transparent 74%);mask-image:radial-gradient(ellipse 78% 54% at 50% 22%,#000 20%,transparent 74%);}

/* ── topbar ── */
.topbar{position:sticky;top:0;z-index:60;background:rgba(5,5,7,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1200px;margin:0 auto;padding:0 var(--gutter);display:flex;align-items:center;justify-content:space-between;min-height:62px;gap:12px;position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.04em}
.brand .dot{width:7px;height:7px;background:var(--accent);box-shadow:0 0 14px 2px rgba(110,86,248,.8);flex-shrink:0}
.secure-tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);display:flex;align-items:center;gap:7px}
.secure-tag svg{width:11px;height:11px;color:var(--accent-lift)}

/* ── page layout ── */
.page{position:relative;z-index:2;min-height:calc(100vh - 62px);display:flex;align-items:flex-start;justify-content:center;padding:clamp(36px,6vw,72px) var(--gutter) 60px}

/* ── card ── */
.card{width:100%;max-width:500px;background:var(--panel);border:1px solid var(--line-2);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent 0%,var(--accent) 40%,var(--accent-lift) 60%,transparent 100%)}
.card-inner{padding:clamp(28px,5vw,44px) clamp(22px,4vw,38px) clamp(22px,4vw,36px)}

/* ── tier header ── */
.tier-badge{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-lift);margin-bottom:16px;display:block}
.tier-price{font-size:clamp(44px,10vw,64px);font-weight:800;letter-spacing:-.06em;line-height:1;font-family:var(--display)}
.tier-price .cents{font-size:clamp(22px,5vw,32px);font-weight:600;letter-spacing:-.03em;opacity:.7}
.tier-name{font-size:clamp(17px,3vw,21px);font-weight:700;letter-spacing:-.03em;margin-top:10px}
.tier-sum{color:var(--muted);font-size:14px;line-height:1.55;margin-top:8px;max-width:38ch}

/* ── divider ── */
.div{height:1px;background:var(--line);margin:24px 0}

/* ── features ── */
.features{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.features li{display:flex;align-items:flex-start;gap:12px;font-size:14px;color:#CFCFD6;line-height:1.4}
.features li .chk{width:16px;height:16px;flex-shrink:0;background:var(--accent-soft);border:1px solid var(--accent-line);display:flex;align-items:center;justify-content:center;margin-top:1px}
.features li .chk svg{width:9px;height:9px;color:var(--accent-lift)}

/* ── trust row ── */
.trust{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2)}
.trust svg{width:12px;height:12px;flex-shrink:0;color:var(--accent-lift)}

/* ── CTA button ── */
.btn-pay{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;letter-spacing:.01em;border:0;position:relative;overflow:hidden;transition:.4s var(--ease);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn-pay::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.14) 50%,transparent 100%);transform:translateX(-110%);transition:transform .7s var(--ease)}
.btn-pay:not(:disabled):hover{background:var(--accent-lift);box-shadow:0 18px 52px -18px rgba(110,86,248,.9)}
.btn-pay:not(:disabled):hover::after{transform:translateX(110%)}
.btn-pay:not(:disabled):active{transform:scale(.98)}
.btn-pay:disabled{opacity:.55;cursor:not-allowed}
.btn-pay .arw{transition:transform .4s var(--ease)}
.btn-pay:not(:disabled):hover .arw{transform:translateX(5px)}
.btn-pay .spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .7s linear infinite;flex-shrink:0;display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-pay.loading .spin{display:block}
.btn-pay.loading .btn-label,.btn-pay.loading .arw{display:none}

/* ── back link ── */
.back-link{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);margin-top:18px;transition:color .25s;width:fit-content;margin-inline:auto}
.back-link:hover{color:var(--muted)}

/* ── error banner ── */
.err{display:none;background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.28);padding:11px 14px;font-size:13px;color:#F87171;line-height:1.5;margin-top:0;margin-bottom:0}
.err.show{display:block}

/* ── 404 ── */
.not-found{text-align:center;padding:clamp(60px,10vw,100px) 20px}
.not-found h1{font-size:clamp(28px,5vw,42px);font-weight:800;letter-spacing:-.04em;margin-bottom:12px}
.not-found p{color:var(--muted);font-size:15px;margin-bottom:28px}
.not-found a{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 24px;border:1px solid var(--line-2);color:var(--text);font-weight:600;font-size:14px;transition:.3s var(--ease)}
.not-found a:hover{border-color:rgba(255,255,255,.32)}

/* ── footer ── */
.footer{border-top:1px solid var(--line);padding:22px var(--gutter);position:relative;z-index:2}
.footer-inner{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.footer p,.footer a{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted-2);text-transform:uppercase}
.footer a{transition:color .25s}
.footer a:hover{color:var(--muted)}

/* ── animate in ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card{animation:fadeUp .55s var(--ease) both}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>

<div class="rails" aria-hidden="true"><div class="rails-inner"><span></span><span></span><span></span><span></span></div></div>
<div class="bg-glow" aria-hidden="true"></div>
<div class="bg-mesh" aria-hidden="true"></div>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/" aria-label="WinOnAny, home"><i class="dot" aria-hidden="true"></i>WinOnAny</a>
    <p class="secure-tag">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="11"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Secure checkout
    </p>
  </div>
</header>

<div class="page">
  <div id="root"></div>
</div>

<footer class="footer">
  <div class="footer-inner">
    <p>18+ only &nbsp;·&nbsp; One payment &nbsp;·&nbsp; No subscription</p>
    <nav style="display:flex;gap:16px"><a href="/">Back to site</a><a href="/#pricing">Pricing</a></nav>
  </div>
</footer>

<script>
(function(){
  'use strict';

  var TIERS = {
    access: {
      badge:    'Starter',
      name:     'Starter Access',
      dollars:  '29',
      cents:    '99',
      summary:  'The entry point. Scripts and openers that actually get responses.',
      features: [
        'First message scripts',
        'Profile optimization guide',
        'Flirting frameworks',
      ],
    },
    system: {
      badge:    'Most Popular',
      name:     'The Vault',
      dollars:  '59',
      cents:    '99',
      summary:  'Full access. Every guide, every platform. Everything you need to start getting wins.',
      features: [
        'Everything in Starter',
        'Platform-specific playbooks (Snap, IG, Tinder, Hinge, X)',
        'Escalation strategies',
        'Conversation breakdowns',
        'Reply psychology guide',
      ],
    },
    control: {
      badge:    'Full Access',
      name:     'Full Access',
      dollars:  '99',
      cents:    '99',
      summary:  'Everything in the vault plus every new drop. Wins on every platform, covered for good.',
      features: [
        'Everything in The Vault',
        'Advanced platform methods',
        'Real screenshot breakdowns',
        'All future content included',
      ],
    },
  };

  var params = new URLSearchParams(window.location.search);
  var tier   = params.get('tier') || '';
  var data   = TIERS[tier];
  var root   = document.getElementById('root');

  /* ── 404 state ── */
  if(!data){
    root.innerHTML =
      '<div class="not-found">' +
        '<h1>Invalid tier.</h1>' +
        '<p>That link doesn\'t match any plan. Head back to pricing and pick one.</p>' +
        '<a href="/#pricing">← See pricing</a>' +
      '</div>';
    return;
  }

  /* ── check icon ── */
  var CHK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>';

  /* ── render card ── */
  var featureItems = data.features.map(function(f){
    return '<li><span class="chk">' + CHK + '</span>' + f + '</li>';
  }).join('');

  root.innerHTML =
    '<div class="card">' +
      '<div class="card-inner">' +
        '<span class="tier-badge">' + data.badge + '</span>' +
        '<div class="tier-price">$' + data.dollars + '<span class="cents">.' + data.cents + '</span></div>' +
        '<p class="tier-name">' + data.name + '</p>' +
        '<p class="tier-sum">' + data.summary + '</p>' +
        '<div class="div"></div>' +
        '<ul class="features">' + featureItems + '</ul>' +
        '<div class="div"></div>' +
        '<div class="trust">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="11"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>' +
          'One payment. No subscription. Instant access.' +
        '</div>' +
        '<div class="div"></div>' +
        '<div class="err" id="errBanner" role="alert" aria-live="polite"></div>' +
        '<button class="btn-pay" id="checkoutBtn" type="button">' +
          '<i class="spin" aria-hidden="true"></i>' +
          '<span class="btn-label">Complete Purchase</span>' +
          '<span class="arw" aria-hidden="true">→</span>' +
        '</button>' +
      '</div>' +
    '</div>' +
    '<a class="back-link" href="/#pricing">← Back to pricing</a>';

  /* ── checkout handler ── */
  var btn = document.getElementById('checkoutBtn');
  var err = document.getElementById('errBanner');

  btn.addEventListener('click', function(){
    btn.disabled = true;
    btn.classList.add('loading');
    err.textContent = '';
    err.classList.remove('show');

    fetch('/api/checkout', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ tier: tier }),
    })
    .then(function(res){ return res.json(); })
    .then(function(json){
      if(json.url){
        window.location.href = json.url;
      } else {
        throw new Error(json.error || 'Checkout error');
      }
    })
    .catch(function(e){
      btn.disabled = false;
      btn.classList.remove('loading');
      err.textContent = e.message || 'Something went wrong — try again.';
      err.classList.add('show');
    });
  });

})();
</script>
</body>
</html>
